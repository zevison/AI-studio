name: Legacy source ZIP candidate (not desktop EXE)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.8'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.3'
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci --ignore-scripts --prefix tools/hypit_provider --no-audit --no-fund
      - run: npm run build:offline --prefix tools/hypit_provider
      - run: python tools/repository_safety.py
      - run: python tools/dev_check.py
      - run: python tools/build_windows_release.py --output build/SeedanceStudio_Candidate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SeedanceStudio-Legacy-Source-QA-Not-Desktop-EXE
          path: |
            build/SeedanceStudio_Candidate.zip
            build/SeedanceStudio_Candidate.zip.sha256
            build/SeedanceStudio_Candidate.receipt.json
