name: Windows prerelease candidate
on:
  workflow_dispatch:
    inputs:
      candidate_tag:
        description: 'Existing matching candidate tag (for example v5.2.0-rc.1)'
        required: true
        type: string
permissions:
  contents: read
jobs:
  candidate:
    runs-on: windows-latest
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Validate tag and source version before expensive work
        shell: pwsh
        env:
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
        run: |
          python -c "import os; from tools.release_preflight import declared_version, validate_tag; from pathlib import Path; validate_tag(os.environ['CANDIDATE_TAG'],declared_version(Path('core/config.py')))"
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci --ignore-scripts --prefix tools/hypit_provider --no-audit --no-fund
      - run: npm run build:offline --prefix tools/hypit_provider
      - run: python tools/repository_safety.py
      - run: python tools/dev_check.py
      - run: python -m unittest discover -s tests_integrated -p test_release_preflight.py
      - run: python tools/build_windows_release.py --output build/SeedanceStudio_Candidate
      - name: Check candidate receipt and packaged files
        shell: pwsh
        env:
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
        run: |
          python tools/release_preflight.py --tag "$env:CANDIDATE_TAG" --archive build/SeedanceStudio_Candidate.zip
      - name: Install Inno Setup compiler
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
      - name: Compile real Chinese EXE setup
        shell: pwsh
        run: |
          $iscc=Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw 'Inno Setup 6 compiler not found' }
          & $iscc '/DAppVersion=5.2.0' 'packaging\SeedanceStudio.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Inno compiler failed' }
          $exe='build\installer\SeedanceStudio_Setup_5.2.0_Candidate.exe'
          if (-not (Test-Path $exe)) { throw 'EXE output missing' }
          $hash=(Get-FileHash -Algorithm SHA256 $exe).Hash.ToLowerInvariant()
          Set-Content -Encoding ascii -Path ($exe+'.sha256') -Value $hash
      - name: Windows installation and data-preservation smoke test
        shell: pwsh
        run: |
          & tools\verify_windows_exe.ps1 -Installer build\installer\SeedanceStudio_Setup_5.2.0_Candidate.exe
          if ($LASTEXITCODE -ne 0) { throw 'Installer smoke test failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: SeedanceStudio-Windows-EXE-Candidate
          retention-days: 30
          if-no-files-found: error
          path: |
            build/installer/SeedanceStudio_Setup_5.2.0_Candidate.exe
            build/installer/SeedanceStudio_Setup_5.2.0_Candidate.exe.sha256
            build/SeedanceStudio_Candidate.receipt.json
