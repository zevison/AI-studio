name: Dependency lifecycle evidence
on:
  workflow_dispatch:
  schedule:
    - cron: '25 3 * * 1'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; verified official release commit
        with:
          persist-credentials: false
      - name: Read official runtime metadata without changing any lock
        run: python3 tools/dependency_audit.py --root . --refresh --output audit-artifact/dependency-audit.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: always()
        with:
          node-version: '22.23.3'
      - name: Query npm advisories without installing packages or running scripts
        if: always()
        shell: bash
        run: |
          set +e
          npm audit --prefix tools/hypit_provider --package-lock-only --omit=dev --json > audit-artifact/npm-runtime.json
          code=$?
          printf '%s\n' "$code" > audit-artifact/npm-runtime.exit.txt
          npm audit --prefix tools/hypit_provider --package-lock-only --json > audit-artifact/npm-all.json
          all_code=$?
          printf '%s\n' "$all_code" > audit-artifact/npm-all.exit.txt
          test "$code" -eq 0 && test "$all_code" -eq 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2; verified official release commit
        if: always()
        with:
          name: dependency-lifecycle-evidence
          path: audit-artifact/
          retention-days: 30
      - name: Surface advisories or incomplete registry checks
        if: always()
        shell: bash
        run: |
          test "$(cat audit-artifact/npm-runtime.exit.txt)" = 0
          test "$(cat audit-artifact/npm-all.exit.txt)" = 0
# This workflow reads public metadata/advisories only. It cannot publish, modify
# a lock, merge a PR, call an AI model or access production credentials.
# pip-audit is intentionally a separately hash-locked tool in an isolated audit
# environment; a local inventory is not represented as a Python vulnerability scan.
